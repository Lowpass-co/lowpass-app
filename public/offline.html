<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF4500" />
    <title>Lowpass — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0f0f0f;
        color: #f3f4f6;
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: auto;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.9375rem;
        line-height: 1.55;
        color: #9ca3af;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 0.625rem;
        padding: 0.625rem 1.125rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        background: #ff4500;
        color: #fff;
      }
      button:hover {
        background: #e63e00;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/lowpass-logo.png" alt="Lowpass" width="144" height="144" />
      <h1>You're offline</h1>
      <p>
        Some pages you've already visited may still be available. Reconnect to load fresh data.
      </p>
      <button type="button" id="retry">Try again</button>
    </div>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
