<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #0F0F0F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #0F0F0F; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="max-width: 480px;">
          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <img src="https://lowpass.vercel.app/lowpass-logo-md.png" alt="Lowpass" width="103" height="80" style="display: block;" />
            </td>
          </tr>
          <!-- Card -->
          <tr>
            <td style="background-color: #1A1A1A; border-radius: 12px; padding: 40px 36px; border: 1px solid #2E2E2E;">
              <h1 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 600; color: #F5F5F5;">
                Confirm your email
              </h1>
              <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #A3A3A3;">
                Hey — thanks for signing up to Lowpass. Just need to confirm it's actually you before we let you in. Click the button below and you're sorted.
              </p>
              <!-- CTA Button -->
              <table cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                <tr>
                  <td style="background-color: #FF4500; border-radius: 8px;">
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 12px 32px; font-size: 15px; font-weight: 600; color: #FFFFFF; text-decoration: none;">
                      Confirm email
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #737373;">
                If you didn't create a Lowpass account, you can safely ignore this. No drama.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top: 24px;">
              <p style="margin: 0; font-size: 12px; color: #737373;">
                Lowpass LTD · London
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
